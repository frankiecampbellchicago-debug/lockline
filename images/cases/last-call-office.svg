    <circle cx="472" cy="522" r="6" fill="#c9a227" stroke="#1c1e21" stroke-width="1.5"/><path d="M478 512l4 -6M482 520h6" stroke="#f2c230" stroke-width="2" stroke-linecap="round"/>
  </svg>