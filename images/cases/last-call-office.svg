    <rect x="610" y="378" width="22" height="20" rx="3" fill="#c9a227" stroke="#1c1e21" stroke-width="2"/><path d="M614 378v-6a7 7 0 0 1 14 0v6" fill="none" stroke="#1c1e21" stroke-width="3"/>
