    <rect x="562" y="364" width="120" height="46" fill="#5d4a36" stroke="#1c1e21" stroke-width="2"/><rect x="562" y="416" width="120" height="46" fill="#5d4a36" stroke="#1c1e21" stroke-width="2"/>
